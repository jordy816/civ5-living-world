# Civ V Living World: what matters is in the first lines. Everything not listed here is
# Minecraft's own default, filled in at the first start.
#
# The world is the board of the game. This line must be here before the world is first made.
level-type=livingworld\:board
level-name=world
# Who may come in: accounts checked with Mojang, and only names on the white list
# (in the server's window: "whitelist add Name"). Somebody who joins takes a seat in your game.
online-mode=true
white-list=true
enforce-whitelist=true
server-port=25565
motd=Civ V Living World
max-players=8
# The view from above shows a wide stretch of land. Lower this (12) on a small machine.
view-distance=20
simulation-distance=6
# Rulers fly over their land.
allow-flight=true
spawn-protection=0
# A long turn of the other civilizations is not a hung server.
max-tick-time=-1
